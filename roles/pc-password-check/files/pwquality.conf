# /etc/security/pwquality.conf
# Politique de mots de passe basée sur les recommandations de l'ANSSI

# Nombre maximum d'essais de saisie
retry = 3

# Longueur minimale de 12 caractères
minlen = 12

# Exige au moins 4 classes de caractères (Majuscules, Minuscules, Chiffres, Spéciaux)
minclass = 4

# Empêche que le mot de passe contienne le nom d'utilisateur
usercheck = 1

# Active la vérification par dictionnaire (nécessite le paquet cracklib-runtime installé par dépendance)
dictcheck = 1

# Refuse plus de 3 caractères identiques consécutifs (ex: aaa)
maxrepeat = 3

# Applique cette politique même à l'utilisateur root
enforce_for_root