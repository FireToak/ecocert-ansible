# ---
# Type        : Tasks
# Rôle        : pc-update-apps
# Description : Mise à jour et installation des paquets.
# ---
---
- name: Mettre à jour le cache et le système
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist

- name: Installer les paquets
  ansible.builtin.apt:
    name: "{{ pc_paquets }}"
    state: present